name: Release

# Builds Jiggy Jungle for Windows and Linux and publishes a GitHub Release that the in-game
# updater picks up. Run it by pushing a tag that matches host/include/jiggy_version.h, e.g.
#   git tag v0.1.0 && git push origin v0.1.0
#
# The game code is generated from a decompressed DK64 ROM at build time, exactly like
# upstream DK64 Recompiled's CI. The ROM never goes in this repository. Instead, put
# donkeykong64.decompressed.us.z64 in a separate PRIVATE repository and set two secrets:
#   JIGGY_ROM_REPO   owner/name of that private repository
#   JIGGY_ROM_TOKEN  a fine-grained token with read access to its contents
# The release archives contain the compiled game but no ROM data; players still load
# both of their own ROMs in the launcher.
#
# The Android APK is added when these secrets are set too (Android only installs an update
# signed with the same key, so the key must stay the same for every release):
#   JIGGY_ANDROID_KEYSTORE           the keystore file, base64-encoded
#   JIGGY_ANDROID_KEYSTORE_PASSWORD  its password
#   JIGGY_ANDROID_KEY_ALIAS          the key's alias
#   JIGGY_ANDROID_KEY_PASSWORD       the key's password
#
# This repository is private (personal use), so the in-game updater needs a token to see its
# releases. Set JIGGY_UPDATE_TOKEN to a fine-grained token limited to this repository with
# read-only "Contents" access; it's built into the release builds. Anyone holding a build can
# extract it, which is why it must be read-only and limited to this one repository.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and release (e.g. v0.1.0)
        required: true

permissions:
  contents: write

env:
  SDL2_VERSION: '2.30.3'
  # Same N64Recomp commit upstream DK64 Recompiled builds with.
  N64RECOMP_COMMIT: '2b6f05688de2abc7d86da5b4a89b84c2c6acbabe'
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      android: ${{ steps.android.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Check the tag matches the game's version
        id: version
        run: |
          version=$(sed -n 's/#define JIGGY_VERSION "\(.*\)"/\1/p' host/include/jiggy_version.h)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG doesn't match JIGGY_VERSION $version in host/include/jiggy_version.h"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check the ROM secrets are set
        env:
          ROM_REPO: ${{ secrets.JIGGY_ROM_REPO }}
          ROM_TOKEN: ${{ secrets.JIGGY_ROM_TOKEN }}
        run: |
          if [ -z "$ROM_REPO" ] || [ -z "$ROM_TOKEN" ]; then
            echo "::error::Set the JIGGY_ROM_REPO and JIGGY_ROM_TOKEN secrets first (see the top of release.yml)."
            exit 1
          fi
      - name: Check for the Android signing key
        id: android
        env:
          KEYSTORE: ${{ secrets.JIGGY_ANDROID_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No JIGGY_ANDROID_KEYSTORE secret, so this release won't include the Android APK."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

  linux-x64:
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          submodules: recursive
      - name: Get the decompressed ROM
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.JIGGY_ROM_REPO }}
          token: ${{ secrets.JIGGY_ROM_TOKEN }}
          path: rom
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev lld llvm clang-15 libcurl4-openssl-dev
          wget -q https://github.com/libsdl-org/SDL/releases/download/release-${SDL2_VERSION}/SDL2-${SDL2_VERSION}.tar.gz
          tar -xzf SDL2-${SDL2_VERSION}.tar.gz
          (cd SDL2-${SDL2_VERSION} && ./configure && make -j"$(nproc)" && sudo make install)
          sudo cp -av /usr/local/lib/libSDL* /lib/x86_64-linux-gnu/
      - name: Build N64Recomp and RSPRecomp
        run: |
          git clone --recurse-submodules https://github.com/N64Recomp/N64Recomp.git N64RecompSource
          cd N64RecompSource
          git checkout "$N64RECOMP_COMMIT"
          git submodule update --init --recursive
          cmake -DCMAKE_BUILD_TYPE=Release -G Ninja -S . -B cmake-build
          cmake --build cmake-build --target N64RecompCLI RSPRecomp -j"$(nproc)"
          cp cmake-build/N64Recomp cmake-build/RSPRecomp ../host/
      - name: Generate the game code
        working-directory: host
        run: |
          cp ../rom/donkeykong64.decompressed.us.z64 .
          ./N64Recomp us.toml
          ./RSPRecomp n_aspMain.toml
          rm donkeykong64.decompressed.us.z64
      - name: Build
        working-directory: host
        env:
          JIGGY_UPDATE_TOKEN: ${{ secrets.JIGGY_UPDATE_TOKEN }}
        run: |
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++-15 -DCMAKE_C_COMPILER=clang-15 \
            -DPATCHES_C_COMPILER=clang-15 -DPATCHES_LD=ld.lld-15 -DJIGGY_UPDATE_TOKEN="$JIGGY_UPDATE_TOKEN" \
            -G Ninja -S . -B cmake-build
          cmake --build cmake-build --target DK64Recompiled -j"$(nproc)"
      - name: Package
        working-directory: host
        run: |
          mkdir package
          cp cmake-build/DK64Recompiled package/
          cp -r assets recompcontrollerdb.txt package/
          tar -czf "../JiggyJungle-${{ needs.prepare.outputs.version }}-linux-x64.tar.gz" -C package .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: JiggyJungle-*-linux-x64.tar.gz

  windows-x64:
    needs: prepare
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          submodules: recursive
      - name: Get the decompressed ROM
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.JIGGY_ROM_REPO }}
          token: ${{ secrets.JIGGY_ROM_TOKEN }}
          path: rom
      - name: Install dependencies
        run: |
          choco install ninja
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://github.com/llvm/llvm-project/releases/download/llvmorg-19.1.3/LLVM-19.1.3-Windows-X64.tar.xz" -OutFile "LLVM.tar.xz"
          New-Item -ItemType Directory -Path portable-llvm > $null
          7z x LLVM.tar.xz
          7z x LLVM.tar -oportable-llvm
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build N64Recomp and RSPRecomp
        run: |
          git clone --recurse-submodules https://github.com/N64Recomp/N64Recomp.git N64RecompSource
          cd N64RecompSource
          git checkout $env:N64RECOMP_COMMIT
          git submodule update --init --recursive
          cmake -DCMAKE_BUILD_TYPE=Release -G Ninja -S . -B cmake-build
          cmake --build cmake-build --target N64RecompCLI RSPRecomp
          cp cmake-build/N64Recomp.exe ../host/
          cp cmake-build/RSPRecomp.exe ../host/
      - name: Generate the game code
        working-directory: host
        run: |
          cp ../rom/donkeykong64.decompressed.us.z64 .
          ./N64Recomp us.toml
          ./RSPRecomp n_aspMain.toml
          Remove-Item donkeykong64.decompressed.us.z64
      - name: Build
        working-directory: host
        env:
          JIGGY_UPDATE_TOKEN: ${{ secrets.JIGGY_UPDATE_TOKEN }}
        run: |
          # Keep the LLVM that ships with Visual Studio first in PATH.
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -ne 'C:\Program Files\LLVM\bin' }) -join ';'
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang-cl -DCMAKE_C_COMPILER=clang-cl `
            -DPATCHES_C_COMPILER="..\portable-llvm\LLVM-19.1.3-Windows-X64\bin\clang" `
            -DPATCHES_LD="..\portable-llvm\LLVM-19.1.3-Windows-X64\bin\ld.lld" `
            -DJIGGY_UPDATE_TOKEN="$env:JIGGY_UPDATE_TOKEN" `
            -DCMAKE_CXX_FLAGS="-Xclang -fexceptions -Xclang -fcxx-exceptions" -G Ninja -S . -B cmake-build
          cmake --build cmake-build --target DK64Recompiled
      - name: Package
        working-directory: host
        run: |
          New-Item -ItemType Directory -Path package > $null
          foreach ($name in "DK64Recompiled.exe", "dxcompiler.dll", "dxil.dll", "SDL2.dll", "libcurl.dll", "zlib1.dll") {
            $file = Get-ChildItem -Path cmake-build -Recurse -Filter $name | Select-Object -First 1
            if (-not $file) { Write-Error "Missing $name"; exit 1 }
            Copy-Item $file.FullName -Destination package/
          }
          Copy-Item -Recurse assets package/
          Copy-Item recompcontrollerdb.txt package/
          Compress-Archive -Path package/* -DestinationPath "../JiggyJungle-${{ needs.prepare.outputs.version }}-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: JiggyJungle-*-windows-x64.zip

  android-arm64:
    needs: prepare
    if: needs.prepare.outputs.android == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Fetch submodules
        run: |
          git submodule update --init --recursive host/lib/N64ModernRuntime host/lib/RecompFrontend host/lib/rt64
          git submodule update --init host/lib/dk64_decomp
          # vcpkg needs its history to find the manifest's baseline.
          git submodule update --init host/lib/vcpkg
      - name: Get the decompressed ROM
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.JIGGY_ROM_REPO }}
          token: ${{ secrets.JIGGY_ROM_TOKEN }}
          path: rom
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang lld
      - name: Build N64Recomp and RSPRecomp
        run: |
          git clone --recurse-submodules https://github.com/N64Recomp/N64Recomp.git N64RecompSource
          cd N64RecompSource
          git checkout "$N64RECOMP_COMMIT"
          git submodule update --init --recursive
          cmake -DCMAKE_BUILD_TYPE=Release -G Ninja -S . -B cmake-build
          cmake --build cmake-build --target N64RecompCLI RSPRecomp -j"$(nproc)"
          cp cmake-build/N64Recomp cmake-build/RSPRecomp ../host/
      - name: Generate the game code
        working-directory: host
        run: |
          cp ../rom/donkeykong64.decompressed.us.z64 .
          ./N64Recomp us.toml
          ./RSPRecomp n_aspMain.toml
          rm donkeykong64.decompressed.us.z64
      - name: Build the game for Android (libmain.so)
        run: android/engine/build-engine.sh DK64Recompiled
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build the signed APK
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.JIGGY_ANDROID_KEYSTORE }}
          JIGGY_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.JIGGY_ANDROID_KEYSTORE_PASSWORD }}
          JIGGY_ANDROID_KEY_ALIAS: ${{ secrets.JIGGY_ANDROID_KEY_ALIAS }}
          JIGGY_ANDROID_KEY_PASSWORD: ${{ secrets.JIGGY_ANDROID_KEY_PASSWORD }}
          JIGGY_UPDATE_TOKEN: ${{ secrets.JIGGY_UPDATE_TOKEN }}
        run: |
          export JIGGY_ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/jiggy.keystore"
          echo "$KEYSTORE_BASE64" | base64 -d > "$JIGGY_ANDROID_KEYSTORE_FILE"
          ./gradlew --no-daemon assembleRelease
          rm -f "$JIGGY_ANDROID_KEYSTORE_FILE"
          cp app/build/outputs/apk/release/app-release.apk \
            "../JiggyJungle-${{ needs.prepare.outputs.version }}-android-arm64.apk"
          # A release APK without the game would only show the launcher.
          unzip -l app/build/outputs/apk/release/app-release.apk | grep -q 'lib/arm64-v8a/libmain.so'
      - uses: actions/upload-artifact@v4
        with:
          name: android-arm64
          path: JiggyJungle-*-android-arm64.apk

  publish:
    needs: [prepare, linux-x64, windows-x64, android-arm64]
    # Runs when the Android job is skipped (no signing key), but not when anything failed.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          (cd dist && sha256sum * > SHA256SUMS.txt)
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "Jiggy Jungle ${{ needs.prepare.outputs.version }}" --generate-notes --verify-tag
